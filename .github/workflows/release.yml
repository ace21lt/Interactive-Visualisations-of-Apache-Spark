name: Deploy Release to Sheffield VPS

on:
  release:
    types: [published] # Triggers only when you publish a new release in GitHub

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest

    steps:
      - name: Execute deployment commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            # Navigate to the project directory
            cd Interactive-Visualisations-of-Apache-Spark
            
            # Fetch all the latest tags from the repository
            git fetch --tags
            
            # Checkout the exact tag associated with the GitHub Release
            git checkout ${{ github.event.release.tag_name }}
            
            # Rebuild and restart the containers cleanly in the background
            sudo docker compose up -d --build
            
            # Clean up old, unused Docker images to save disk space
            sudo docker image prune -f