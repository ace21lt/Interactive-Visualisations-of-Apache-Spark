name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    if: ${{ (secrets.PLAYWRIGHT_BASE_URL != '' || vars.PLAYWRIGHT_BASE_URL != '') && secrets.DATABRICKS_WORKSPACE_URL != '' && secrets.DATABRICKS_PAT_TOKEN != '' }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      working-directory: frontend
      run: npm ci
    - name: Install Playwright Browsers
      working-directory: frontend
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      working-directory: frontend
      env:
        PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL || vars.PLAYWRIGHT_BASE_URL }}
        PLAYWRIGHT_BASIC_AUTH_PASSWORD: ${{ secrets.PLAYWRIGHT_BASIC_AUTH_PASSWORD }}
        DATABRICKS_WORKSPACE_URL: ${{ secrets.DATABRICKS_WORKSPACE_URL }}
        DATABRICKS_PAT_TOKEN: ${{ secrets.DATABRICKS_PAT_TOKEN }}
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: frontend/playwright-report/
        retention-days: 30
