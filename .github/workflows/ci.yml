name: Scala CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    types: [ opened, synchronize, reopened ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Setup Java
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'sbt'

      # Step 3: Setup SBT (cached binary — replaces slow apt-get install)
      - name: Setup SBT
        uses: sbt/setup-sbt@v1

      # Step 4: Check Scalafmt formatting
      - name: Check Scalafmt
        run: |
          echo "::group::Checking Scala code formatting"
          sbt scalafmtCheckAll || (echo "Scala files are not formatted. Run 'sbt scalafmtAll' locally." && exit 1)
          echo "All Scala files are properly formatted"
          echo "::endgroup::"

          echo "::group::Checking build.sbt formatting"
          sbt scalafmtSbtCheck || (echo "build.sbt is not formatted. Run 'sbt scalafmtAll' locally." && exit 1)
          echo "build.sbt is properly formatted"
          echo "::endgroup::"
        continue-on-error: false

      # Step 5: Compile the project
      - name: Compile code
        run: sbt compile
        continue-on-error: false

      # Step 6: Run unit tests with coverage (no 'clean' — reuses compiled classes from Step 5)
      - name: Run unit tests with coverage
        run: sbt coverage test coverageReport
        continue-on-error: false
        env:
          CI: true

      # Step 7: Report coverage
      - name: Report coverage
        if: always()
        run: |
          if [ -f target/scala-3.3.1/scoverage-report/scoverage.xml ]; then
            COVERAGE=$(grep -oP 'statement-rate="\K[^"]+' target/scala-3.3.1/scoverage-report/scoverage.xml | head -1)
            echo "Test coverage: ${COVERAGE}%"
            echo "coverage=${COVERAGE}" >> $GITHUB_OUTPUT
          else
            echo "No coverage report found"
          fi

      # Step 8: Run integration tests
      - name: Run integration tests
        if: success() || failure()
        run: sbt "testOnly *RoutesSpec *LoginLogoutSpec"
        continue-on-error: false
        env:
          CI: true