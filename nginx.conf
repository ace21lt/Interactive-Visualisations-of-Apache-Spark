server {
    listen 80;
    server_name ivis.shef.ac.uk;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ivis.shef.ac.uk;

    client_max_body_size 50M;

    # SSL Certificate Paths
    ssl_certificate /etc/letsencrypt/live/ivis.shef.ac.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ivis.shef.ac.uk/privkey.pem;

    # Modern SSL Security Protocols
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Dozzle live log dashboard subpath routing with Password Protection
    location /logs {
        return 301 $scheme://$host/logs/;
    }

    location ^~ /logs/ {
        auth_basic "Restricted Access - Dozzle Logs";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://dozzle:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
    }

    # Main Application
    location / {
        proxy_pass http://ivis-app:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket Support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }
}